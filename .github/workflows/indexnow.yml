name: Ping search engines

# After content pushes to main, notify IndexNow (Bing, Yandex, Naver, Seznam)
# + Bing's sitemap ping so pages get recrawled without manual submission.
# Google's /ping endpoint was retired — Google picks up sitemap.xml from
# robots.txt + Search Console automatically.
#
# IndexNow requires a key file hosted at the site root — that's
# 7e51769cc1373889001fe8a2d4cd0f4e.txt in this repo (public by design).

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'sitemap.xml'
      - 'releases.json'
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages deploy
        run: sleep 90

      - name: Fetch live sitemap
        run: curl -fsSL https://meesai.net/sitemap.xml -o sitemap.xml

      - name: Submit URLs to IndexNow
        run: |
          URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<[^>]*>//g' | jq -R . | jq -sc .)
          curl -s -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json' \
            -d "{
              \"host\": \"meesai.net\",
              \"key\": \"7e51769cc1373889001fe8a2d4cd0f4e\",
              \"keyLocation\": \"https://meesai.net/7e51769cc1373889001fe8a2d4cd0f4e.txt\",
              \"urlList\": $URLS
            }" -w '\nIndexNow HTTP %{http_code}\n'

      - name: Ping Bing sitemap
        run: curl -s -o /dev/null -w 'Bing ping HTTP %{http_code}\n' "https://www.bing.com/ping?sitemap=https%3A%2F%2Fmeesai.net%2Fsitemap.xml"
