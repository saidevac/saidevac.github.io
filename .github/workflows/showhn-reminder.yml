name: Show HN reminder

# HN peak window: Tue–Thu ~8–10am ET. This opens a reminder issue at
# 12:30 UTC Tue + Thu (~8:30am ET / ~11:30pm AEDT) with ready-to-paste
# titles — HN has no submission API and auto-posting gets domains flagged,
# so the last step stays manual by design.

on:
  schedule:
    - cron: '30 12 * * 2,4'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build kit + open reminder issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node tools/dist-kit.js svgmotion --out dist-kit
          # skip if a Show HN reminder is already open
          OPEN=$(gh issue list --search "Show HN window" --state open --json number --jq 'length')
          if [ "$OPEN" = "0" ]; then
            gh issue create --title "📣 Show HN window — SVGMotion ($(date +%a %d %b))" \
              --body-file dist-kit/svgmotion/showhn.md
          else
            echo "open Show HN reminder already exists — skipping"
          fi
